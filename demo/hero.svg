<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f2ef"/>
      <stop offset="100%" stop-color="#ebe5df"/>
    </linearGradient>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#004182"/>
    </linearGradient>
    <linearGradient id="card-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.1)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviceation="20" flood-color="#003" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="1200" height="675" fill="url(#page-bg)"/>

  <!-- LinkedIn nav bar -->
  <rect x="0" y="0" width="1200" height="52" fill="#ffffff"/>
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#e0dfdc" stroke-width="1"/>

  <!-- LinkedIn logo -->
  <rect x="24" y="9" width="34" height="34" rx="4" fill="#0a66c2"/>
  <text x="41" y="34" fill="#fff" font-size="22" font-style="italic" text-anchor="middle" font-family="Georgia, serif">in</text>

  <!-- Search box -->
  <rect x="74" y="9" width="280" height="34" rx="4" fill="#edf3f8"/>
  <text x="90" y="31" fill="rgba(0,0,0,0.45)" font-size="13">Search</text>

  <!-- Nav tabs (right side) -->
  <text x="800" y="32" fill="rgba(0,0,0,0.6)" font-size="12">Home</text>
  <text x="860" y="32" fill="rgba(0,0,0,0.9)" font-size="12" font-weight="600">Jobs</text>
  <line x1="852" y1="50" x2="884" y2="50" stroke="#1a1a1a" stroke-width="2"/>
  <text x="912" y="32" fill="rgba(0,0,0,0.6)" font-size="12">Network</text>
  <text x="980" y="32" fill="rgba(0,0,0,0.6)" font-size="12">Messages</text>

  <!-- Left sidebar (recommended jobs) -->
  <rect x="16" y="76" width="244" height="240" rx="8" fill="#ffffff" stroke="#e0dfdc"/>
  <text x="32" y="100" fill="rgba(0,0,0,0.9)" font-size="14" font-weight="600">Recommended jobs</text>
  <text x="32" y="118" fill="rgba(0,0,0,0.6)" font-size="12">Based on your profile</text>

  <line x1="32" y1="138" x2="244" y2="138" stroke="#e0dfdc"/>
  <text x="32" y="158" fill="rgba(0,0,0,0.9)" font-size="13">Backend Engineer</text>
  <text x="32" y="174" fill="rgba(0,0,0,0.45)" font-size="11">Anthropic · 2d</text>
  <line x1="32" y1="188" x2="244" y2="188" stroke="#e0dfdc"/>

  <text x="32" y="208" fill="rgba(0,0,0,0.9)" font-size="13">ML Platform Engineer</text>
  <text x="32" y="224" fill="rgba(0,0,0,0.45)" font-size="11">Cohere · 4d</text>
  <line x1="32" y1="238" x2="244" y2="238" stroke="#e0dfdc"/>

  <text x="32" y="258" fill="rgba(0,0,0,0.9)" font-size="13">Senior SWE, Infra</text>
  <text x="32" y="274" fill="rgba(0,0,0,0.45)" font-size="11">Vercel · 1w</text>

  <!-- Main job card -->
  <rect x="276" y="76" width="544" height="560" rx="8" fill="#ffffff" stroke="#e0dfdc"/>
  <text x="304" y="116" fill="rgba(0,0,0,0.9)" font-size="22" font-weight="600">Senior Backend Engineer, AI Platform</text>
  <text x="304" y="142" fill="rgba(0,0,0,0.9)" font-size="14" font-weight="600">Anthropic</text>
  <text x="370" y="142" fill="rgba(0,0,0,0.6)" font-size="14">· San Francisco, CA</text>
  <text x="304" y="162" fill="rgba(0,0,0,0.45)" font-size="12">Posted 2 days ago · 47 applicants · Sponsorship available</text>

  <!-- Easy Apply button -->
  <rect x="304" y="180" width="98" height="32" rx="16" fill="#0a66c2"/>
  <text x="353" y="201" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Easy Apply</text>

  <!-- Save button -->
  <rect x="412" y="180" width="68" height="32" rx="16" fill="none" stroke="rgba(0,0,0,0.6)"/>
  <text x="446" y="201" fill="rgba(0,0,0,0.6)" font-size="13" font-weight="600" text-anchor="middle">Save</text>

  <!-- About the role -->
  <text x="304" y="248" fill="rgba(0,0,0,0.9)" font-size="15" font-weight="600">About the role</text>
  <text x="304" y="276" fill="rgba(0,0,0,0.75)" font-size="13">Anthropic is looking for a Senior Backend Engineer to build</text>
  <text x="304" y="294" fill="rgba(0,0,0,0.75)" font-size="13">and scale our AI platform. You will work on distributed systems</text>
  <text x="304" y="312" fill="rgba(0,0,0,0.75)" font-size="13">serving production LLM workloads, focusing on reliability,</text>
  <text x="304" y="330" fill="rgba(0,0,0,0.75)" font-size="13">latency, and developer experience.</text>

  <!-- Bullet points -->
  <circle cx="312" cy="365" r="2.5" fill="rgba(0,0,0,0.45)"/>
  <text x="324" y="370" fill="rgba(0,0,0,0.75)" font-size="13">5+ years building production backend services</text>
  <circle cx="312" cy="389" r="2.5" fill="rgba(0,0,0,0.45)"/>
  <text x="324" y="394" fill="rgba(0,0,0,0.75)" font-size="13">Deep expertise in Python, Go, or Java with distributed systems</text>
  <circle cx="312" cy="413" r="2.5" fill="rgba(0,0,0,0.45)"/>
  <text x="324" y="418" fill="rgba(0,0,0,0.75)" font-size="13">Experience with Kubernetes, observability, and SRE practices</text>
  <circle cx="312" cy="437" r="2.5" fill="rgba(0,0,0,0.45)"/>
  <text x="324" y="442" fill="rgba(0,0,0,0.75)" font-size="13">Strong product sense and a bias for shipping</text>

  <!-- ApplySharp Sidebar (right) -->
  <g filter="url(#shadow)">
    <rect x="840" y="52" width="360" height="623" fill="#ffffff"/>
    <line x1="840" y1="52" x2="840" y2="675" stroke="#e0dfdc"/>
  </g>

  <!-- ApplySharp Header -->
  <g transform="translate(864, 76)">
    <rect width="28" height="28" rx="6" fill="url(#logo-bg)"/>
    <circle cx="12.7" cy="15.3" r="7.5" stroke="#fff" stroke-width="1.3" fill="none" opacity="0.32"/>
    <circle cx="12.7" cy="15.3" r="4.8" stroke="#fff" stroke-width="1.3" fill="none" opacity="0.7"/>
    <circle cx="12.7" cy="15.3" r="1.5" fill="#fff"/>
    <path d="M12.7 15.3 L21.9 6.1" stroke="#fff" stroke-width="1.75" stroke-linecap="round"/>
    <path d="M18.0 6.1 L21.9 6.1 L21.9 10.0" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="900" y="98" fill="rgba(0,0,0,0.9)" font-size="22" font-style="italic" font-family="Georgia, serif">ApplySharp</text>
  <circle cx="1140" cy="92" r="3" fill="#057642"/>
  <text x="1148" y="96" fill="#057642" font-size="10" font-weight="600" letter-spacing="1">LOCAL</text>
  <line x1="864" y1="116" x2="1176" y2="116" stroke="#e0dfdc"/>

  <!-- ATS score label -->
  <text x="1020" y="148" fill="rgba(0,0,0,0.45)" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">ATS MATCH SCORE</text>

  <!-- Score gauge -->
  <g transform="translate(1020, 250)">
    <circle cx="0" cy="0" r="75" fill="none" stroke="#e0dfdc" stroke-width="10"/>
    <!-- 87% arc, starts from top, going clockwise -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#0a66c2" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="471.24" stroke-dashoffset="61.26" transform="rotate(-90)"/>
    <text x="0" y="14" fill="rgba(0,0,0,0.9)" font-size="56" font-family="Georgia, serif" text-anchor="middle">87</text>
    <text x="0" y="36" fill="rgba(0,0,0,0.45)" font-size="10" font-weight="600" letter-spacing="1.2" text-anchor="middle">STRONG MATCH</text>
  </g>

  <!-- Matched keywords section -->
  <text x="864" y="368" fill="rgba(0,0,0,0.6)" font-size="11" font-weight="600" letter-spacing="0.5">MATCHED KEYWORDS</text>
  <text x="1176" y="368" fill="rgba(0,0,0,0.45)" font-size="11" text-anchor="end">12 / 14</text>

  <!-- Match chips -->
  <g font-size="12" font-weight="500">
    <rect x="864" y="380" width="68" height="22" rx="11" fill="#ddedd9"/>
    <text x="898" y="395" fill="#057642" text-anchor="middle">Backend</text>

    <rect x="940" y="380" width="86" height="22" rx="11" fill="#ddedd9"/>
    <text x="983" y="395" fill="#057642" text-anchor="middle">Distributed</text>

    <rect x="1034" y="380" width="64" height="22" rx="11" fill="#ddedd9"/>
    <text x="1066" y="395" fill="#057642" text-anchor="middle">Python</text>

    <rect x="864" y="410" width="48" height="22" rx="11" fill="#ddedd9"/>
    <text x="888" y="425" fill="#057642" text-anchor="middle">Java</text>

    <rect x="920" y="410" width="86" height="22" rx="11" fill="#ddedd9"/>
    <text x="963" y="425" fill="#057642" text-anchor="middle">Kubernetes</text>
  </g>

  <!-- Gaps section -->
  <text x="864" y="468" fill="rgba(0,0,0,0.6)" font-size="11" font-weight="600" letter-spacing="0.5">GAPS TO ADDRESS</text>
  <text x="1176" y="468" fill="rgba(0,0,0,0.45)" font-size="11" text-anchor="end">2</text>

  <!-- Miss chips -->
  <g font-size="12" font-weight="500">
    <rect x="864" y="480" width="100" height="22" rx="11" fill="#fde7d3"/>
    <text x="914" y="495" fill="#b24020" text-anchor="middle">SRE practices</text>

    <rect x="972" y="480" width="100" height="22" rx="11" fill="#fde7d3"/>
    <text x="1022" y="495" fill="#b24020" text-anchor="middle">Observability</text>
  </g>

  <!-- Quick Tailor button -->
  <rect x="864" y="540" width="312" height="44" rx="22" fill="#0a66c2"/>
  <text x="1020" y="567" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">Quick Tailor</text>

  <!-- Sponsorship badge -->
  <rect x="864" y="604" width="312" height="40" rx="8" fill="#f3f2ef" stroke="#e0dfdc"/>
  <circle cx="884" cy="624" r="4" fill="#057642"/>
  <text x="900" y="628" fill="rgba(0,0,0,0.9)" font-size="12" font-weight="600">H-1B sponsorship: Available</text>
  <text x="900" y="641" fill="rgba(0,0,0,0.6)" font-size="10">Anthropic filed 47 H-1B petitions in 2025</text>
</svg>
